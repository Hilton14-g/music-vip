<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="vipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="28" fill="#08090d"/>
  <circle cx="50" cy="50" r="38" stroke="url(#vipGrad)" stroke-width="2.5" fill="#12131f" />
  <circle cx="50" cy="50" r="16" stroke="url(#vipGrad)" stroke-width="1.5" fill="#08090d" opacity="0.8"/>
  <circle cx="50" cy="50" r="5" fill="#00f2fe" filter="url(#glow)"/>
  <!-- Musical note in foreground -->
  <path d="M45 65 A 7 7 0 1 1 52 58 L 52 35 L 68 30 L 68 40 L 55 44 L 55 58" fill="none" stroke="url(#vipGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
